<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — DRDB Music</title>
  <!-- Empêche l'indexation de l'espace admin -->
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <!-- Netlify Identity : gère la connexion/inscription des admins -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS (anciennement Netlify CMS) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Si quelqu'un arrive ici via un lien d'invitation/récupération de mot de passe,
    // on ouvre automatiquement la fenêtre de connexion Netlify Identity.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
